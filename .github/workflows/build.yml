
name: Build Flutter APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Gradle and AGP Versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Fix Gradle wrapper
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          s = p.read_text()
          s = re.sub(
              r'gradle-[0-9.]+-(?:all|bin)\.zip',
              'gradle-8.14.3-all.zip',
              s
          )
          p.write_text(s)

          # Fix Android Gradle Plugin
          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
          ]

          for p in files:
              if not p.exists():
                  continue

              lines = p.read_text().splitlines(keepends=True)

              for i, line in enumerate(lines):
                  if ('com.android.application' in line or
                      'com.android.tools.build:gradle' in line):
                      line = re.sub(
                          r'(?<=version ")[^"]+(?=")',
                          '8.11.1',
                          line
                      )
                      line = re.sub(
                          r'(?<=version \')[^\']+(?=\')',
                          '8.11.1',
                          line
                      )
                      line = re.sub(
                          r'(com\.android\.tools\.build:gradle:)'
                          r'[0-9.]+',
                          r'\g<1>8.11.1',
                          line
                      )
                      lines[i] = line

              p.write_text(''.join(lines))

          print("Gradle and AGP version update completed.")
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
