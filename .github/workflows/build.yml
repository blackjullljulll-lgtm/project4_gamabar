#!/usr/bin/env bash
# Jalankan dari ROOT proyek Flutter:  bash fix_gradle.sh
# Memperbaiki error: "Your project's Gradle version (8.10.2) is lower than Flutter's minimum 9.3.1"
set -euo pipefail

GRADLE_VERSION="9.3.1"
AGP_VERSION="9.0.0"      # sesuaikan jika perlu (cek tabel kompatibilitas AGP-Gradle)
KOTLIN_VERSION="2.2.20"  # sesuaikan jika perlu

if [ ! -d android ]; then
  echo "ERROR: folder 'android' tidak ditemukan. Jalankan script ini dari root proyek Flutter." >&2
  exit 1
fi

# portable sed -i (Linux & macOS)
sedi() { if sed --version >/dev/null 2>&1; then sed -i "$@"; else sed -i '' "$@"; fi; }

echo "==> 1/5 Update Gradle wrapper ke ${GRADLE_VERSION}"
WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
sedi -E "s#^distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip#" "$WRAPPER"
grep distributionUrl "$WRAPPER"

echo "==> 2/5 Update versi AGP & Kotlin di settings.gradle(.kts)"
for f in android/settings.gradle.kts android/settings.gradle; do
  [ -f "$f" ] || continue
  sedi -E "s#(id\(\"com\.android\.application\"\) version \")[^\"]+#\1${AGP_VERSION}#" "$f"
  sedi -E "s#(id\(\"org\.jetbrains\.kotlin\.android\"\) version \")[^\"]+#\1${KOTLIN_VERSION}#" "$f"
  sedi -E "s#(id \"com\.android\.application\" version \")[^\"]+#\1${AGP_VERSION}#" "$f"
  sedi -E "s#(id \"org\.jetbrains\.kotlin\.android\" version \")[^\"]+#\1${KOTLIN_VERSION}#" "$f"
  echo "   diperbarui: $f"
  grep -E "com.android.application|kotlin.android" "$f" || true
done

echo "==> 3/5 Pastikan Java 17 di workflow GitHub Actions (jika ada)"
if [ -d .github/workflows ]; then
  for w in .github/workflows/*.yml .github/workflows/*.yaml; do
    [ -f "$w" ] || continue
    sedi -E "s#(java-version: *['\"]?)(8|11)(['\"]?)#\117\3#" "$w"
    echo "   dicek: $w"
  done
fi

echo "==> 4/5 Bersihkan build lama"
flutter clean
flutter pub get

echo "==> 5/5 Build APK release"
flutter build apk --release

echo "SELESAI. APK: build/app/outputs/flutter-apk/app-release.apk"
